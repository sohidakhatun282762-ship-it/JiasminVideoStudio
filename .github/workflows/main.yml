name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project folder
        run: |
          F=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "settings.gradle.kts not found. Files in repository:"
            find . -not -path './.git/*' -maxdepth 3
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$F")" >> "$GITHUB_ENV"
          echo "Project folder: $(dirname "$F")"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unit tests
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Check APK path
        run: ls -l "$PROJECT_DIR/app/build/outputs/apk/debug/"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JiasminVideoStudio-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            ${{ env.PROJECT_DIR }}/build.log
            ${{ env.PROJECT_DIR }}/app/build/reports/
          if-no-files-found: ignore
